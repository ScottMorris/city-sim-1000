    <text x="568" y="356">compact mode pins this popover</text>

    <path d="M560 414 L364 271" stroke="#7d8fa8" fill="none" marker-end="url(#lead)" opacity="0.7"/>
    <text x="568" y="410" fill="#dbe6f4" font-weight="bold">R3 · live-voice indicator</text>
