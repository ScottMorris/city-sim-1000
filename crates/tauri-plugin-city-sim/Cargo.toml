[package]
name        = "tauri-plugin-city-sim"
description = "Tauri v2 plugin that runs city-sim-core natively for the desktop target"
links       = "tauri-plugin-city-sim"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true

[lib]
crate-type = ["rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
city-sim-core     = { path = "../city-sim-core"     }
city-sim-protocol = { path = "../city-sim-protocol" }
serde        = { workspace = true }
postcard     = { workspace = true }
thiserror    = { workspace = true }
tauri        = { version = "2" }
