  <text x="166" y="608" fill="#55657c" font-size="9" text-anchor="middle">92</text>
  <text x="248" y="608" fill="#55657c" font-size="9" text-anchor="middle">96</text>
  <text x="330" y="608" fill="#55657c" font-size="9" text-anchor="middle">100</text>
  <text x="412" y="608" fill="#55657c" font-size="9" text-anchor="middle">104</text>
  <text x="496" y="608" fill="#55657c" font-size="9" text-anchor="middle">108</text>
  <circle cx="102" cy="586" r="4" fill="#4dd9e8"/>
  <circle cx="248" cy="586" r="4" fill="#4dd9e8"/>
  <circle cx="453" cy="586" r="4" fill="none" stroke="#ff5d5d" stroke-dasharray="2 2"/>
  <line x1="343" y1="566" x2="343" y2="600" stroke="#f5a623" stroke-width="3"/>
  <text x="343" y="560" fill="#ffd28a" font-size="10" text-anchor="middle">101.3</text>
  <text x="76" y="566" fill="#7d8fa8" font-size="10">TUNING</text>

  <!-- annotations -->
  <g font-size="11" fill="#a9bad1">
    <path d="M560 106 L178 114" stroke="#7d8fa8" fill="none" marker-end="url(#lead)" opacity="0.7"/>
    <text x="568" y="102" fill="#dbe6f4" font-weight="bold">R1 · segment-aware skip</text>
    <text x="568" y="118">next skips segments; emergency</text>
    <text x="568" y="132">bulletins are not skippable</text>

    <path d="M560 168 L128 122" stroke="#7d8fa8" fill="none" marker-end="url(#lead)" opacity="0.7"/>
    <text x="568" y="164" fill="#dbe6f4" font-weight="bold">R1 · pause = tune out</text>
    <text x="568" y="180">broadcast clock keeps running;</text>
    <text x="568" y="194">resume fast-forwards to now</text>

    <path d="M560 250 L252 271" stroke="#7d8fa8" fill="none" marker-end="url(#lead)" opacity="0.7"/>
    <text x="568" y="246" fill="#dbe6f4" font-weight="bold">R1 · kind badge + EBS state</text>
