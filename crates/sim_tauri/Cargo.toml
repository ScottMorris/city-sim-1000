[package]
name        = "sim_tauri"
description = "Tauri v2 plugin/backend that runs sim_core natively for the desktop target"
version.workspace    = true
edition.workspace    = true
authors.workspace    = true
license.workspace    = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
sim_core     = { path = "../sim_core" }
sim_protocol = { path = "../sim_protocol" }
serde        = { workspace = true }
postcard     = { workspace = true }
thiserror    = { workspace = true }

# Tauri added when the desktop app phase begins:
# tauri        = { version = "2", features = ["wry"] }
