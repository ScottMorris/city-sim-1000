name: Workspace Quality and Validation CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: read
  packages: read
  pull-requests: write

jobs:
  rust-fmt:
    name: Rust format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        id: rust_fmt
        run: cargo fmt --all -- --check

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Rust format"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.rust_fmt.outcome }}\`"
            echo "- Command: \`cargo fmt --all -- --check\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  rust-clippy:
    name: Rust clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2

      - name: Run Clippy
        id: rust_clippy
        run: cargo clippy --workspace --exclude city-sim-wasm --all-targets -- -D warnings

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Rust clippy"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.rust_clippy.outcome }}\`"
            echo "- Command: \`cargo clippy --workspace --exclude city-sim-wasm --all-targets -- -D warnings\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  rust-test:
    name: Rust test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # This picks up the two Rust harnesses without any extra wiring: the
      # golden city (`tests/golden_city.rs`, ~0.5 s) and the soak
      # (`tests/soak.rs`, ~8 s at the default `SOAK` size). nextest gives each
      # its own process and runs them alongside the unit tests, so the soak is
      # what sets this job's test wall clock and the rest is free.
      #
      # The soak's *long* mode is not run here — see the `rust-soak-long` job.
      - name: Run Rust tests
        id: rust_tests
        run: cargo nextest run --workspace --exclude city-sim-wasm --profile ci

      # `crates/city-sim-protocol/tests/export_bindings.rs` and
      # `crates/tauri-plugin-city-sim/tests/export_bindings.rs` (run above, as
      # part of the workspace test run) regenerate
      # `app/src/game/protocol/generated/` and
      # `crates/tauri-plugin-city-sim/guest-js/generated/` deterministically —
      # see those files' doc comments. If either directory is dirty here, a
      # `#[derive(TS)]` type changed without the checked-in TS mirror being
      # regenerated alongside it.
      - name: Check generated TS bindings are up to date
        id: ts_bindings_fresh
        # `git add -N` (intent-to-add) before the diff so a brand new file
        # under either directory (a new `#[derive(TS)]` type whose output was
        # never committed) shows up as a diff too — a plain `git diff
        # --exit-code` only compares tracked files and would silently miss it.
        run: |
          git add -N -- app/src/game/protocol/generated/ crates/tauri-plugin-city-sim/guest-js/generated/
          if ! git diff --exit-code -- app/src/game/protocol/generated/ crates/tauri-plugin-city-sim/guest-js/generated/; then
            echo "::error::Generated TS bindings are out of date. Run 'cargo test -p city-sim-protocol -p tauri-plugin-city-sim' locally and commit the diff under app/src/game/protocol/generated/ and crates/tauri-plugin-city-sim/guest-js/generated/."
            exit 1
          fi

      - name: Upload Rust test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Publish Rust test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: City Sim Rust tests
          files: target/nextest/ci/junit.xml

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Rust tests"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.rust_tests.outcome }}\`"
            echo "- Command: \`cargo nextest run --workspace --exclude city-sim-wasm --profile ci\`"
            echo "- Includes the golden city (\`tests/golden_city.rs\`) and the default-size soak (\`tests/soak.rs\`)"
            echo "- Golden dump: \`crates/city-sim-core/tests/fixtures/golden_city.expected\` — regenerate deliberately with \`GOLDEN=regen\`, see \`docs/testing.md\`"
            echo "- Generated TS bindings freshness: \`${{ steps.ts_bindings_fresh.outcome }}\` (\`app/src/game/protocol/generated/\`, \`crates/tauri-plugin-city-sim/guest-js/generated/\`)"
            echo "- Test artefact: \`target/nextest/ci/junit.xml\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # The long soak — 3 000 simulated days, 90 000 ticks. Opt-in only: it costs
  # minutes rather than seconds, and the default-size soak in `rust-test`
  # already catches everything this one does, just with less headroom. Run it
  # from the Actions tab ("Run workflow") before merging anything that touches
  # allocation on the tick or wire-emit paths.
  rust-soak-long:
    name: Rust soak (long, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2

      # `--nocapture` on purpose: the soak's checkpoint and allocation tables
      # are how a failure is read, and they go to stdout.
      - name: Run the long soak
        id: rust_soak_long
        run: cargo test -p city-sim-core --test soak -- --nocapture
        env:
          SOAK: long

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Rust soak (long, manual)"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.rust_soak_long.outcome }}\`"
            echo "- Command: \`SOAK=long cargo test -p city-sim-core --test soak -- --nocapture\` (3 000 simulated days)"
            echo "- Locally: \`bun run test:soak:long\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  rust-determinism:
    name: Rust determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run golden hash determinism test
        id: rust_determinism
        run: cargo nextest run --package city-sim-core -E 'test(golden_hash)' --profile ci

      - name: Upload determinism test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-determinism-results-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Rust determinism (${{ matrix.os }})"
            echo
            echo "- Runner: \`${{ matrix.os }}\`"
            echo "- Result: \`${{ steps.rust_determinism.outcome }}\`"
            echo "- Command: \`cargo nextest run --package city-sim-core -E 'test(golden_hash)' --profile ci\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  rust-mutants-diff:
    name: Rust mutants (diff)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    outputs:
      missed: ${{ steps.rust_mutants_count.outputs.missed }}
      outcome: ${{ steps.rust_mutants_diff.outcome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # `--in-diff` needs the merge base, which a shallow clone lacks.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Read the cache the scheduled full run writes on the default branch.
          # A cache saved from a pull-request branch is only visible to that
          # branch, so this job restores and never saves.
          shared-key: rust-mutants
          save-if: 'false'

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Diff against the base branch
        # Redirected rather than piped through `tee`: the default shell is
        # `bash -e` without `pipefail`, so a pipeline would hide a failing
        # `git diff` behind tee's exit code and mutate nothing at all.
        run: |
          base="origin/${{ github.base_ref }}"
          git diff "${base}...HEAD" > mutants.diff
          git diff --stat "${base}...HEAD" -- 'crates/**/*.rs'

      - name: Run cargo-mutants over the diff
        id: rust_mutants_diff
        # Advisory: a surviving mutant is reported on the pull request and in
        # the job summary, but does not block the merge. See AGENTS.md
        # "Mutation testing" for what a surviving mutant means and the condition
        # for turning this into a gate.
        continue-on-error: true
        # `--in-place` builds in the checkout so the restored cache is reused;
        # it also disables the automatic timeout, which is why `--timeout` is
        # explicit. `--baseline run` proves the unmutated tree passes first, so
        # a MISSED result cannot be an already-failing suite.
        #
        # Exit codes: 0 all caught, 2 mutants survived, 3 a mutant hung,
        # 4 the baseline itself is red, 5/6 a malformed diff.
        run: cargo mutants --in-place --in-diff mutants.diff --baseline run --timeout 20

      - name: Count surviving mutants
        id: rust_mutants_count
        if: always()
        run: |
          missed=0
          if [ -f mutants.out/missed.txt ]; then
            missed=$(wc -l < mutants.out/missed.txt)
          fi
          echo "missed=${missed}" >> "${GITHUB_OUTPUT}"

      - name: Upload mutants artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-mutants-diff
          path: mutants.out/
          if-no-files-found: ignore

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Rust mutants (diff)"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.rust_mutants_diff.outcome }}\` (advisory — does not block merge)"
            echo "- Command: \`cargo mutants --in-place --in-diff mutants.diff --baseline run --timeout 20\`"
            if [ -f mutants.out/missed.txt ]; then
              echo "- Caught: \`$(wc -l < mutants.out/caught.txt)\` · missed: \`$(wc -l < mutants.out/missed.txt)\` · timed out: \`$(wc -l < mutants.out/timeout.txt)\` · unviable: \`$(wc -l < mutants.out/unviable.txt)\`"
              if [ -s mutants.out/missed.txt ]; then
                echo
                echo "Mutants no test noticed — each is either a missing assertion or an"
                echo "equivalent mutant that cannot change behaviour. Say which, in the PR."
                echo
                echo '```'
                cat mutants.out/missed.txt
                echo '```'
                echo
              fi
              echo "- Artefact: \`rust-mutants-diff\` (\`mutants.out/\`)"
            else
              echo "- No mutants generated: the diff touches no mutable Rust source, so there is no report to upload."
            fi
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  ts-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      # `wasmSim.worker.ts` imports the wasm-pack output directly (no
      # `@ts-ignore`), so `tsc --noEmit` needs `app/src/wasm/` on disk the
      # same way a fresh clone/worktree does — see the comment above that
      # import.
      - name: Build WASM target
        run: bun run build:wasm

      - name: Run TypeScript typecheck
        id: ts_typecheck
        run: bun run lint

      - name: Write summary
        if: always()
        run: |
          {
            echo "## TypeScript typecheck"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.ts_typecheck.outcome }}\`"
            echo "- Command: \`bun run lint\` (\`tsc --noEmit\`)"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  ts-test:
    name: TypeScript test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `tauriSimBridge.test.ts` imports `tauriSimBridge.ts`, which statically
      # imports `tauri-plugin-city-sim` for its default (non-test) plugin
      # bindings — Vite resolves that package's `dist-js/` output at
      # transform time regardless of the test's injected fakes, so this job
      # needs the build exactly as `mobile-e2e` does.
      - name: Build Tauri plugin JS
        run: bun run build:plugin-js

      - name: Run TypeScript tests
        id: ts_tests
        run: bun run test:ci

      - name: Upload TypeScript test artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ts-test-results
          path: app/test-results/junit.xml
          if-no-files-found: warn

      - name: Publish TypeScript test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: City Sim TypeScript tests
          files: app/test-results/junit.xml

      - name: Write summary
        if: always()
        run: |
          {
            echo "## TypeScript tests"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.ts_tests.outcome }}\`"
            echo "- Command: \`bun run test:ci\` (vitest + JUnit reporter)"
            echo "- Test artefact: \`app/test-results/junit.xml\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  mcp-test:
    name: MCP relay test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run MCP relay tests
        id: mcp_tests
        run: bun run test:mcp

      - name: Write summary
        if: always()
        run: |
          {
            echo "## MCP relay tests"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.mcp_tests.outcome }}\`"
            echo "- Command: \`bun run test:mcp\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  wasm-build:
    name: WASM build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build WASM target
        id: wasm_build
        run: wasm-pack build crates/city-sim-wasm --target web --out-dir ../../app/src/wasm/sim_wasm

      - name: Write summary
        if: always()
        run: |
          {
            echo "## WASM build"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.wasm_build.outcome }}\`"
            echo "- Command: \`wasm-pack build crates/city-sim-wasm --target web --out-dir ../../app/src/wasm/sim_wasm\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  mobile-e2e:
    name: Mobile e2e (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build WASM target
        run: bun run build:wasm

      - name: Build Tauri plugin JS
        run: bun run build:plugin-js

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: cd app && bunx playwright install --with-deps chromium

      # Runs all three Playwright projects: mobile-portrait, mobile-landscape
      # and visual. The visual project is the screenshot regression over the
      # wire bytes `display.rs` derives; its baselines are committed under
      # `app/e2e/__screenshots__/linux/` and are Linux-specific, which is why
      # it has to run on this Linux runner and not a developer's machine.
      - name: Run e2e suite (mobile emulation + visual regression)
        id: mobile_e2e
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          if-no-files-found: warn

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Mobile e2e (Playwright)"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.mobile_e2e.outcome }}\`"
            echo "- Command: \`bun run test:e2e\` (mobile-portrait + mobile-landscape + visual projects)"
            echo "- Visual baselines: \`app/e2e/__screenshots__/linux/\` — update with \`bun run test:visual:update\` on Linux"
            echo "- Report artefact: \`app/playwright-report/\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  tauri-plugin-build:
    name: Tauri plugin build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build Tauri plugin
        id: tauri_plugin_build
        run: cargo build -p tauri-plugin-city-sim

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Tauri plugin build"
            echo
            echo "- Runner: \`ubuntu-24.04\`"
            echo "- Result: \`${{ steps.tauri_plugin_build.outcome }}\`"
            echo "- Command: \`cargo build -p tauri-plugin-city-sim\`"
            echo "- Run URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

  report-pr-results:
    name: PR summary
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    needs:
      - rust-fmt
      - rust-clippy
      - rust-test
      - rust-determinism
      - rust-mutants-diff
      - ts-typecheck
      - ts-test
      - mcp-test
      - wasm-build
      - mobile-e2e
      - tauri-plugin-build
    runs-on: ubuntu-latest
    steps:
      - name: Post CI summary comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ci-check-summary -->';
            const label = (result) =>
              result === 'success' ? '[PASS]' :
              result === 'failure' ? '[FAIL]' : '[SKIP]';

            const rustFmt    = '${{ needs.rust-fmt.result }}';
            const rustCliffy = '${{ needs.rust-clippy.result }}';
            const rustTests  = '${{ needs.rust-test.result }}';
            const rustDeterm = '${{ needs.rust-determinism.result }}';
            // The mutants step is advisory, so the job result is green either
            // way. Report the surviving-mutant count, which is the real signal.
            const mutantsOutcome = '${{ needs.rust-mutants-diff.outputs.outcome }}';
            const mutantsMissed  = '${{ needs.rust-mutants-diff.outputs.missed }}';
            const tsCheck    = '${{ needs.ts-typecheck.result }}';
            const tsTests    = '${{ needs.ts-test.result }}';
            const mcpTests   = '${{ needs.mcp-test.result }}';
            const wasmBuild  = '${{ needs.wasm-build.result }}';
            const mobileE2e  = '${{ needs.mobile-e2e.result }}';
            const tauriBuild = '${{ needs.tauri-plugin-build.result }}';

            const body = [
              marker,
              '## CI check summary',
              '',
              `- ${label(rustFmt)} Rust format: \`${rustFmt}\``,
              `- ${label(rustCliffy)} Rust clippy: \`${rustCliffy}\``,
              `- ${label(rustTests)} Rust tests: \`${rustTests}\``,
              `- ${label(rustDeterm)} Rust determinism (x64 + arm64): \`${rustDeterm}\``,
              mutantsMissed === ''
                ? `- [SKIP] Rust mutants in this diff (advisory): no result — the job did not reach the mutants step`
                : `- ${mutantsMissed === '0' ? '[PASS]' : '[WARN]'} Rust mutants in this diff (advisory): \`${mutantsMissed}\` survived (step: \`${mutantsOutcome}\`)`,
              `- ${label(tsCheck)} TypeScript typecheck: \`${tsCheck}\``,
              `- ${label(tsTests)} TypeScript tests: \`${tsTests}\``,
              `- ${label(mcpTests)} MCP relay tests: \`${mcpTests}\``,
              `- ${label(wasmBuild)} WASM build: \`${wasmBuild}\``,
              `- ${label(mobileE2e)} Mobile e2e (Playwright): \`${mobileE2e}\``,
              `- ${label(tauriBuild)} Tauri plugin build: \`${tauriBuild}\``,
            ].join('\n');

            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }
