    <text x="568" y="440">speech settings</text>

    <path d="M560 486 L524 486" stroke="#7d8fa8" fill="none" marker-end="url(#lead)" opacity="0.7"/>
    <text x="568" y="482" fill="#dbe6f4" font-weight="bold">R2 · bounded transcript</text>
    <text x="568" y="498">catch the bulletin you</text>
    <text x="568" y="512">half-heard; session-only</text>

    <path d="M560 574 L524 580" stroke="#7d8fa8" fill="none" marker-end="url(#lead)" opacity="0.7"/>
    <text x="568" y="570" fill="#dbe6f4" font-weight="bold">R4 · tuning dial</text>
    <text x="568" y="586">undertone static between stops;</text>
    <text x="568" y="600">dashed stop = pirate station</text>
